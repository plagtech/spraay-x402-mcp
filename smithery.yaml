# Smithery configuration — https://smithery.ai/docs/build/project-config/smithery.yaml
name: "Spraay"
description: "Full-stack DeFi infrastructure for AI agents on Base. 33 tools for payments, swaps, bridge, payroll, invoicing, escrow, oracle, analytics, AI inference & data. Agents pay USDC per request via x402 protocol. No API keys needed."
icon: "https://raw.githubusercontent.com/plagtech/spraay-x402-mcp/main/spraay-logo-1000x1000.png"

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - evmPrivateKey
    properties:
      evmPrivateKey:
        type: string
        title: "EVM Private Key"
        description: "Private key of a wallet with USDC on Base mainnet. Used for automatic x402 micropayments ($0.001-$0.02 per call)."
      gatewayUrl:
        type: string
        title: "Gateway URL"
        description: "Spraay x402 Gateway URL. Override only for custom deployments."
        default: "https://gateway.spraay.app"
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["dist/index.js"],
      env: {
        EVM_PRIVATE_KEY: config.evmPrivateKey,
        SPRAAY_GATEWAY_URL: config.gatewayUrl || "https://gateway.spraay.app"
      }
    })
  exampleConfig:
    evmPrivateKey: "0xYOUR_PRIVATE_KEY_WITH_USDC_ON_BASE"
    gatewayUrl: "https://gateway.spraay.app"
